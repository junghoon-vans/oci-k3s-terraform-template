name: Terraform

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tftpl"
      - ".terraform.lock.hcl"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tftpl"
      - ".terraform.lock.hcl"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: Trusted Terraform operation (main branch only)
        type: choice
        options:
          - plan
          - apply
        default: plan
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Terraform Fmt Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (no backend)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform Validate
        run: terraform validate -no-color

  check-secrets:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment: terraform-plan
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check trusted environment credentials
        id: check
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          if [ -n "$OCI_TENANCY_OCID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OCI credentials are not configured in the terraform-plan environment; trusted plan/apply will be skipped. See README.md#cicd."
          fi

  plan:
    needs: check-secrets
    if: github.ref == 'refs/heads/main' && needs.check-secrets.outputs.configured == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment: terraform-plan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Write OCI credentials
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          umask 077
          printf '%s' "$OCI_PRIVATE_KEY" > "$RUNNER_TEMP/oci_api_key.pem"
          mkdir -p "$HOME/.oci"
          {
            printf '[DEFAULT]\n'
            printf 'tenancy=%s\n' "$OCI_TENANCY_OCID"
            printf 'user=%s\n' "$OCI_USER_OCID"
            printf 'fingerprint=%s\n' "$OCI_FINGERPRINT"
            printf 'key_file=%s\n' "$RUNNER_TEMP/oci_api_key.pem"
            printf 'region=%s\n' "$OCI_REGION"
          } > "$HOME/.oci/config"
          echo "TF_VAR_private_key_path=$RUNNER_TEMP/oci_api_key.pem" >> "$GITHUB_ENV"
      - name: Terraform Init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_NAMESPACE: ${{ secrets.TF_STATE_NAMESPACE }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="namespace=$TF_STATE_NAMESPACE" \
            -backend-config="region=$OCI_REGION" \
            -backend-config="key=oci-a1-k3s/terraform.tfstate" \
            -backend-config="auth=APIKey" \
            -backend-config="config_file_profile=DEFAULT"

      - name: Terraform Plan
        env:
          TF_IN_AUTOMATION: "true"
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_ssh_authorized_keys: ${{ secrets.OCI_SSH_AUTHORIZED_KEYS }}
          TF_VAR_image_ocid: ${{ secrets.OCI_ARM_IMAGE_OCID }}
          TF_VAR_amd_image_ocid: ${{ secrets.OCI_AMD_IMAGE_OCID }}
          TF_VAR_k3s_token: ${{ secrets.K3S_TOKEN }}
          TF_VAR_tailscale_auth_key_server: ${{ secrets.TAILSCALE_AUTH_KEY_SERVER }}
          TF_VAR_tailscale_auth_key_agent: ${{ secrets.TAILSCALE_AUTH_KEY_AGENT }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Summarize plan
        run: terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"

      # Plan files contain sensitive values; upload only the encrypted artifact.
      - name: Encrypt Terraform plan artifact
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          plan_key="$(printf '%s' "$OCI_PRIVATE_KEY" | openssl dgst -sha256 -binary | openssl base64 -A)"
          unset OCI_PRIVATE_KEY
          umask 077
          printf '%s' "$plan_key" | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
            -in tfplan -out tfplan.enc -pass stdin
          rm -f tfplan
          unset plan_key

      - name: Upload approved plan candidate
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-plan
          path: tfplan.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
    runs-on: ubuntu-24.04
    environment: terraform-apply
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Write OCI credentials
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          umask 077
          printf '%s' "$OCI_PRIVATE_KEY" > "$RUNNER_TEMP/oci_api_key.pem"
          mkdir -p "$HOME/.oci"
          {
            printf '[DEFAULT]\n'
            printf 'tenancy=%s\n' "$OCI_TENANCY_OCID"
            printf 'user=%s\n' "$OCI_USER_OCID"
            printf 'fingerprint=%s\n' "$OCI_FINGERPRINT"
            printf 'key_file=%s\n' "$RUNNER_TEMP/oci_api_key.pem"
            printf 'region=%s\n' "$OCI_REGION"
          } > "$HOME/.oci/config"
          echo "TF_VAR_private_key_path=$RUNNER_TEMP/oci_api_key.pem" >> "$GITHUB_ENV"
      - name: Terraform Init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_NAMESPACE: ${{ secrets.TF_STATE_NAMESPACE }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="namespace=$TF_STATE_NAMESPACE" \
            -backend-config="region=$OCI_REGION" \
            -backend-config="key=oci-a1-k3s/terraform.tfstate" \
            -backend-config="auth=APIKey" \
            -backend-config="config_file_profile=DEFAULT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: terraform-plan

      - name: Decrypt Terraform plan artifact
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          plan_key="$(printf '%s' "$OCI_PRIVATE_KEY" | openssl dgst -sha256 -binary | openssl base64 -A)"
          unset OCI_PRIVATE_KEY
          umask 077
          printf '%s' "$plan_key" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in tfplan.enc -out tfplan -pass stdin
          unset plan_key

      - name: Terraform Apply
        env:
          TF_IN_AUTOMATION: "true"
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_ssh_authorized_keys: ${{ secrets.OCI_SSH_AUTHORIZED_KEYS }}
          TF_VAR_image_ocid: ${{ secrets.OCI_ARM_IMAGE_OCID }}
          TF_VAR_amd_image_ocid: ${{ secrets.OCI_AMD_IMAGE_OCID }}
          TF_VAR_k3s_token: ${{ secrets.K3S_TOKEN }}
          TF_VAR_tailscale_auth_key_server: ${{ secrets.TAILSCALE_AUTH_KEY_SERVER }}
          TF_VAR_tailscale_auth_key_agent: ${{ secrets.TAILSCALE_AUTH_KEY_AGENT }}
        run: terraform apply -input=false tfplan
